<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OnSkin Waitlist</title>
    <meta name="description" content="Join the OnSkin waitlist." />
    <style>
      :root {
        --paper: #f5f1ea;
        --ink: #201b15;
        --muted: #756b61;
        --line: rgba(32, 27, 21, 0.14);
      }
      body {
        margin: 0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--paper);
        color: var(--ink);
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      form {
        width: min(520px, 100%);
      }
      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 56px;
        font-weight: 400;
        letter-spacing: 0;
      }
      p {
        color: var(--muted);
        line-height: 1.55;
      }
      label {
        display: block;
        margin-top: 28px;
        font-weight: 700;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        margin-top: 8px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: var(--ink);
        font: inherit;
      }
      button {
        margin-top: 14px;
        border: 0;
        border-radius: 8px;
        padding: 14px 16px;
        background: var(--ink);
        color: var(--paper);
        font: inherit;
        font-weight: 700;
      }
      small {
        display: block;
        margin-top: 14px;
        color: var(--muted);
      }
      @media (max-width: 520px) {
        h1 {
          font-size: 42px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <form method="post" action="/api/waitlist">
        <h1>Join the waitlist.</h1>
        <p>Get notified when OnSkin is available in your store.</p>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
        <input type="hidden" name="source" value="phase8_public_site" />
        <button type="submit">Join waitlist</button>
        <small>No ads. No data sales. You can unsubscribe anytime.</small>
      </form>
    </main>
  </body>
</html>
