<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OnSkin Support</title>
    <meta name="description" content="Contact OnSkin support." />
    <style>
      body {
        margin: 0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f1ea;
        color: #201b15;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      section {
        width: min(620px, 100%);
      }
      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 56px;
        font-weight: 400;
        letter-spacing: 0;
      }
      p {
        color: #756b61;
        line-height: 1.55;
      }
      a {
        color: #201b15;
        font-weight: 700;
      }
      @media (max-width: 520px) {
        h1 {
          font-size: 42px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Support</h1>
        <p>
          For account, billing, export, deletion, or product questions, contact
          <a href="mailto:__SUPPORT_EMAIL__">__SUPPORT_EMAIL__</a>.
        </p>
        <p>Subscription billing is managed by Apple or Google. Deleting your account does not cancel store billing.</p>
      </section>
    </main>
  </body>
</html>
