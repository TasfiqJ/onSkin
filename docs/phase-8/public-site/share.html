<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Public Link Unavailable</title>
    <meta
      name="description"
      content="Public links are unavailable. This page does not display user content or select content from the address."
    />
    <style>
      :root {
        --paper: #f5f1ea;
        --ink: #201b15;
        --muted: #756b61;
      }
      body {
        margin: 0;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: var(--paper);
        color: var(--ink);
      }
      main {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      section {
        width: min(680px, 100%);
      }
      h1 {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 64px;
        font-weight: 400;
        line-height: 0.95;
      }
      p {
        color: var(--muted);
        font-size: 18px;
        line-height: 1.55;
      }
      @media (max-width: 520px) {
        h1 {
          font-size: 44px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Public links are unavailable.</h1>
        <p>This page does not display user content or use the address to select content.</p>
      </section>
    </main>
  </body>
</html>
