name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'

jobs:
  account-deletion-postgres:
    name: Account deletion rehearsals on PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        postgres:
          - 15-alpine
          - 17-alpine
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false

      - name: Execute all isolated PostgreSQL rehearsals
        run: |
          set -euo pipefail
          current_container=''
          cleanup() {
            if [ -n "$current_container" ]; then
              docker rm -f "$current_container" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          while IFS='|' read -r database script; do
            if [ -z "$database" ]; then
              continue
            fi
            current_container="layerwell-${database}-${{ matrix.postgres }}"
            echo "Running $script in isolated PostgreSQL ${{ matrix.postgres }} cluster"
            docker run --detach \
              --name "$current_container" \
              --env POSTGRES_PASSWORD=layerwell_rehearsal \
              --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
              --workdir /workspace/scripts/phase9 \
              "postgres:${{ matrix.postgres }}" >/dev/null
            ready='false'
            for attempt in $(seq 1 60); do
              if docker exec "$current_container" pg_isready -U postgres >/dev/null 2>&1; then
                ready='true'
                break
              fi
              sleep 1
            done
            if [ "$ready" != 'true' ]; then
              echo "PostgreSQL did not become ready for $script" >&2
              exit 1
            fi
            # The official image briefly accepts connections during initdb,
            # then restarts the server. Wait through that handoff and require
            # the final post-init server to accept connections.
            sleep 2
            ready='false'
            for attempt in $(seq 1 60); do
              if docker exec "$current_container" pg_isready -U postgres >/dev/null 2>&1; then
                ready='true'
                break
              fi
              sleep 1
            done
            if [ "$ready" != 'true' ]; then
              echo "PostgreSQL final server did not become ready for $script" >&2
              exit 1
            fi
            docker exec "$current_container" createdb -U postgres "$database"
            docker exec \
              --workdir /workspace/scripts/phase9 \
              "$current_container" \
              psql -U postgres -d "$database" -v ON_ERROR_STOP=1 -f "$script"
            docker rm -f "$current_container" >/dev/null
            current_container=''
          done <<'REHEARSALS'
          account_deletion_0048|account-deletion-lifecycle-postgres-rehearsal.sql
          revenuecat_barrier_0049|revenuecat-deletion-barrier-postgres-rehearsal.sql
          service_writers_0050|service-writer-deletion-barriers-postgres-rehearsal.sql
          revenuecat_tombstones_0051|revenuecat-identity-tombstones-postgres-rehearsal.sql
          account_publication_fence_0052|account-publication-fence-postgres-rehearsal.sql
          entitlement_lanes_0053|entitlement-authority-lanes-postgres-rehearsal.sql
          catalog_scan_minimization_0059|catalog-scan-minimization-postgres-rehearsal.sql
          cat07_truthful_freshness_0060|cat07-truthful-freshness-postgres-rehearsal.sql
          catalog_import_upgrade_0061|catalog-import-0061-upgrade-postgres-rehearsal.sql
          catalog_curation_upgrade_0062|catalog-curation-0062-upgrade-postgres-rehearsal.sql
          skin_profile_upgrade_0064|skin-profile-0064-upgrade-postgres-rehearsal.sql
          skin_profile_upgrade_0075|skin-profile-0075-upgrade-postgres-rehearsal.sql
          catalog_operator_upgrade_0065|catalog-operator-0065-upgrade-postgres-rehearsal.sql
          clinical_content_upgrade_0066|clinical-content-0066-upgrade-postgres-rehearsal.sql
          catalog_release_lint_contract_0067|catalog-release-0067-lint-contract-postgres-rehearsal.sql
          REHEARSALS

  supabase-local-reset:
    name: Credential-free Supabase reset and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false

      - name: Setup Node
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Check local-only database contract
        run: npm run phase2:db-local-contract

      - name: Reset twice, test, lint, and prove zero drift
        run: npm run phase2:db-local-verify

      - name: Retain generated public types for parity diagnosis
        if: ${{ failure() }}
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: db05-current-chain-types-${{ github.run_id }}
          path: ${{ runner.temp }}/db05-generated-public-types.ts
          if-no-files-found: ignore
          retention-days: 7

  checks:
    name: Repository quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: layerwell_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false

      - name: Setup Node
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm

      - name: Setup Deno
        # denoland/setup-deno v2.0.4
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.7.5

      - name: Install from lockfile
        run: npm ci

      - name: Verify installed iOS native sources
        run: |
          npm run postinstall:check
          npm run phase5:expo-widgets-lifecycle:test
          npm run phase9:view-shot-privacy:test
          npm run phase9:ios-privacy-source-audit:test
          npm run phase9:ios-privacy-source-audit:check
          npm run phase9:ios-archive-privacy-evidence:test
          npm run phase9:release-candidate-git-contract:test
          npm run phase9:verification-wiring:test
          npm run phase9:store-build-inspect:check

      - name: Verify store-only client delivery
        run: node scripts/optimization/store-only-release-audit-smoke.mjs

      - name: Verify governed release provenance
        run: |
          npm run phase9:release-qa-integrity:test
          npm run phase9:governed-evidence-chain:test
          npm run phase9:governed-publication-coverage:test
          npm run phase9:git-status-exclusion:test
          npm run phase9:dependency-sbom:test
          npm run e2e:human:manifest:contract:test
          npm run phase7:qa-packet:contract:test

      - name: Verify iOS Simulator compile workflow contract
        run: npm run phase5:ios-simulator-compile-workflow:test

      - name: Check Expo dependency compatibility
        working-directory: apps/mobile
        run: npx expo install --check

      - name: Run Expo Doctor
        working-directory: apps/mobile
        run: npx expo-doctor

      - name: Check export statistics analyzer
        run: node scripts/optimization/export-stats-smoke.mjs

      - name: Check deterministic optimization fixtures
        run: node scripts/optimization/generate-fixtures-smoke.mjs

      - name: Check local Edge Function contracts
        run: |
          npm run phase2:check-env-smoke
          npm run phase9:edge-manifest-smoke
          npm run phase9:rate-limit-index-smoke
          npm run phase9:edge-functions-check
          npm run phase9:data-rights-smoke
          npm run phase9:data-export-contract-smoke
          npm run phase9:account-provider-deletion-smoke
          npm run phase9:account-service-scrub-smoke
          npm run phase9:account-deletion-durable-smoke
          npm run phase9:account-deletion-work-lane-smoke
          npm run phase9:apple-auth-work-lane-smoke
          npm run phase9:order-attribution-integrity-smoke
          npm run phase9:revenuecat-webhook-atomic-smoke

      - name: Check catalog promotion, curation, and receipt contracts
        run: |
          npm run phase4:source-policy-smoke
          npm run phase4:qa-report-smoke
          npm run phase4:beta-coverage-report-smoke
          npm run phase4:beta-coverage-contract:test
          npm run phase4:source-worklist:check
          npm run phase4:promotion-contract:test
          npm run phase4:curation-contract:test
          npm run phase4:catalog-serving-contract:test
          npm run phase4:catalog-report-privacy-smoke

      - name: Execute account service scrub migration rehearsal
        env:
          PGPASSWORD: layerwell_rehearsal
        run: >-
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1
          -f scripts/phase9/account-service-scrub-postgres-rehearsal.sql

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check performance readiness docs
        run: npm run docs:performance-readiness-audit:check

      - name: Check device support policy
        run: npm run docs:device-support-policy-audit:check

      - name: Check source packet
        run: npm run docs:source-packet-audit:check

  expo-export:
    name: Expo export (${{ matrix.platform }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ios
          - android
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false

      - name: Setup Node
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Export ${{ matrix.platform }} with source maps
        working-directory: apps/mobile
        env:
          NODE_ENV: production
        run: >-
          npx expo export
          --platform ${{ matrix.platform }}
          --output-dir ../../quality-artifacts/exports/${{ matrix.platform }}
          --source-maps external
          --dump-assetmap
          --clear

      - name: Analyze ${{ matrix.platform }} export
        run: |
          mkdir -p quality-artifacts/stats
          node scripts/optimization/export-stats.mjs \
            --input "quality-artifacts/exports/${{ matrix.platform }}" \
            --platform "${{ matrix.platform }}" \
            --generated-at "$(git show -s --format=%cI "$GITHUB_SHA")" \
            --source-sha "$GITHUB_SHA" \
            --json "quality-artifacts/stats/${{ matrix.platform }}.json" \
            --markdown "quality-artifacts/stats/${{ matrix.platform }}.md"

      - name: Upload content-free export statistics
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expo-export-stats-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            quality-artifacts/stats/${{ matrix.platform }}.json
            quality-artifacts/stats/${{ matrix.platform }}.md
          if-no-files-found: error
          retention-days: 30
