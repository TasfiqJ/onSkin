name: Campaign46 current source diagnostics (technical only)

on:
  pull_request:

permissions:
  contents: read

jobs:
  scanners:
    name: Current source scanners; no G97 admission
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.21.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare authenticated tools and normal application installation
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/c46-scanner-evidence"
          python -B scripts/phase9/security_acceptance/bootstrap_tools.py "$RUNNER_TEMP/c46-tools" 2>&1 | tee "$RUNNER_TEMP/c46-scanner-evidence/bootstrap.log"
          node "$RUNNER_TEMP/c46-tools/npm/node_modules/npm/bin/npm-cli.js" ci --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/c46-scanner-evidence/normal-install.log"
      - name: Execute current source scans and preserve every raw result
        env:
          C46_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          CURRENT_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python -I -B - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, tarfile, urllib.request
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'c46-scanner-evidence'
          assert out.is_dir()
          tools_root = out.parent / 'c46-tools'
          sys.path.insert(0, str(root / 'scripts/phase9/security_acceptance'))
          from collect import verify_tool_sources
          from contract import SEMGREP_ENTRY, scan_coverage
          policy = json.loads((root / 'scripts/phase9/security_acceptance/proposal.json').read_bytes())
          tools = json.loads((tools_root / 'tools.json').read_bytes())
          verify_tool_sources(tools, policy)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          assert head == os.environ['C46_EXPECTED_HEAD']
          snapshot = out.parent / 'c46-exact-source'
          snapshot.mkdir()
          rows = []
          process = subprocess.Popen(['git', 'archive', '--format=tar', head], stdout=subprocess.PIPE)
          with tarfile.open(fileobj=process.stdout, mode='r|') as archive:
              for member in archive:
                  path = pathlib.PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in member.name and ':' not in member.name
                  destination = snapshot.joinpath(*path.parts)
                  if member.isdir():
                      destination.mkdir(parents=True, exist_ok=True)
                      continue
                  assert member.isfile() and member.size <= 500_000_000
                  raw = archive.extractfile(member).read()
                  assert len(raw) == member.size
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(raw)
                  rows.append({'path': member.name, 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
          assert process.wait() == 0
          (out / 'source-manifest.json').write_text(json.dumps({'head': head, 'files': rows}, sort_keys=True))
          results = {}
          def run(name, argv, cwd, timeout=1200):
              with (out / (name + '.stdout')).open('wb') as stdout, (out / (name + '.stderr')).open('wb') as stderr:
                  try:
                      result = subprocess.run(list(map(str, argv)), cwd=cwd, stdout=stdout, stderr=stderr, timeout=timeout)
                      code = result.returncode
                  except subprocess.TimeoutExpired:
                      code = 124
              results[name] = {'argv': list(map(str, argv)), 'exit': code}
              (out / 'process-results.json').write_text(json.dumps(results, indent=2))
          configs = []
          original_owasp = policy['rules']['owasp-top-ten']
          current_owasp = '0be8cbb823baae205bf86be0f274f412a659b5132cf1de3e902f03da19a25dbc'
          for name, expected in policy['rules'].items():
              if name == 'owasp-top-ten':
                  # The original immutable hash is retained as an open custody
                  # boundary. This separate C46 snapshot is never equivalent.
                  raw = (root / 'scripts/release/full-app-j01/c46-rules/owasp-top-ten-current.yaml').read_bytes()
                  assert hashlib.sha256(raw).hexdigest() == current_owasp
              else:
                  request = urllib.request.Request('https://semgrep.dev/c/p/' + name, headers={'User-Agent': 'Semgrep/1.181.0'})
                  raw = urllib.request.urlopen(request, timeout=60).read()
                  assert hashlib.sha256(raw).hexdigest() == expected, 'UNCHANGED_RULE_HASH_REQUIRED:' + name
              path = out / (name + '.yaml')
              path.write_bytes(raw)
              configs += ['--config', path]
          explicit_sql = sorted(row['path'] for row in rows if row['path'].startswith('supabase/tests/') and row['path'].endswith('.sql'))
          original_explicit = scan_coverage(policy)['explicitTargets']
          assert set(original_explicit).issubset(explicit_sql), 'ORIGINAL_SQL_COVERAGE_OMISSION'
          (out / 'explicit-sql-targets.json').write_text(json.dumps({'originalForced': original_explicit, 'currentForced': explicit_sql}, indent=2))
          run('semgrep', [sys.executable, '-I', '-S', '-B', '-c', SEMGREP_ENTRY, tools['semgrep'],
              'scan', '--error', '--strict', '--oss-only', '--metrics=off', '--jobs=1', '--max-memory=1536',
              '--timeout=120', '--max-target-bytes=4194304', '--no-git-ignore', '--verbose',
              '--json', '--output=' + str(out / 'semgrep.json'), *configs, '.', *explicit_sql], snapshot, 2400)
          run('workflow-context-controls', [sys.executable, '-I', '-B',
              'scripts/release/full-app-j01/workflow_context46.test.py'], root)
          context = out / 'candidate22-context'
          run('workflow-context-materialization', [sys.executable, '-I', '-B',
              'scripts/release/full-app-j01/workflow_context46.py', '--root', root,
              '--output-directory', context, '--head', head, '--pr', '47'], root)
          if results['workflow-context-materialization']['exit'] == 0:
              # Additional, reversible context analysis of the complete frozen
              # workflow. The original full-source scan/errors stay above.
              run('semgrep-candidate22-context', [sys.executable, '-I', '-S', '-B', '-c', SEMGREP_ENTRY, tools['semgrep'],
                  'scan', '--error', '--strict', '--oss-only', '--metrics=off', '--jobs=1', '--max-memory=1536',
                  '--timeout=120', '--max-target-bytes=4194304', '--no-git-ignore', '--verbose',
                  '--json', '--output=' + str(out / 'semgrep-candidate22-context.json'),
                  *configs, context / 'candidate22-context.yml'], root, 1200)
          run('gitleaks', [tools['gitleaks'], 'detect', '--no-git', '--source=' + str(snapshot),
              '--config=' + str(root / 'scripts/phase9/security_acceptance/gitleaks.toml'), '--redact=100',
              '--exit-code=2', '--report-format=json', '--report-path=' + str(out / 'gitleaks-redacted.json')], snapshot)
          run('osv', [tools['osv'], 'scan', 'source', '--recursive', '--format=json',
              '--output=' + str(out / 'osv.json'), '.'], snapshot)
          run('npm-audit', ['node', tools['npm'], 'audit', '--audit-level=high', '--json'], root)
          run('npm-graph', ['node', tools['npm'], 'ls', '--all', '--json', '--long'], root)
          run('semantic-security', ['node', '--test', 'scripts/release/full-app-j01/security_completion46.test.mjs'], root)
          run('bounded-expo-output', ['node', '--test', 'scripts/release/full-app-j01/patch-expo-collection-bounds46.test.mjs'], root)
          if os.environ.get('CURRENT_SOURCE_BRANCH') == 'stage/m1-native-runtime47':
              run('current-install-wiring', ['node', 'scripts/release/full-app-j01/native_generated47.mjs', '--release-install-wiring47-test'], root)
          else:
              run('current-install-wiring', ['node', '--test', 'scripts/phase9/release-install-wiring46.test.mjs'], root)
          historical_commit = '2cffa9e92be101af4e3b371f1815ec9f458d8da4'
          historical_lock = subprocess.check_output(['git', '--no-replace-objects', 'show',
              historical_commit + ':package-lock.json'], cwd=root)
          historical_sha = hashlib.sha256(historical_lock).hexdigest()
          assert historical_sha == '7656c2e6bf482df5a9bc94c9789816a40c5f2b5cfb30e2f10748411229c136cb'
          (out / 'exact-history-object.json').write_text(json.dumps({
              'commit': historical_commit, 'path': 'package-lock.json', 'sha256': historical_sha,
              'qualification': 'AUTHENTICATED_HISTORICAL_INPUT_CURRENT_UNCHANGED_TESTS_NOT_OWNER_ADMISSION'}, indent=2))
          run('exact-history-source-controls', ['node', '--test', '--test-concurrency=1',
              'scripts/phase9/ios-privacy-source-audit.test.mjs'], root)
          if os.environ['CURRENT_SOURCE_BRANCH'] == 'stage/m1-native-runtime47':
              current47 = 'scripts/release/full-app-j01/native_generated47.mjs'
              run('current-native-complete-config', ['node', current47, '--native-config47'], root)
              run('current-complete-store-inspection', ['node', current47, '--native-store47', '--check'], root)
              run('current-native-successor-tests', ['node', '--test', 'scripts/release/full-app-j01/native_generated47.test.mjs'], root)
              run('current-native-successor', ['node', current47, '--phase', 'SOURCE'], root)
          else:
              run('current-native-complete-config', ['node', tools['npm'], 'run', 'phase5:check-native-config'], root)
              run('current-complete-store-inspection', ['node', tools['npm'], 'run', 'phase9:store-build-inspect:check'], root)
              run('current-native-successor-tests', ['node', '--test', 'scripts/phase9/ios-privacy-lock-succession46.test.mjs'], root)
              run('current-native-successor', ['node', 'scripts/release/full-app-j01/native_current46.mjs'], root)
          summary = {'head': head, 'qualification': 'CURRENT_SOURCE_TECHNICAL_ONLY_NOT_G97',
              'completeSnapshotFiles': len(rows), 'completeSnapshotBytes': sum(row['bytes'] for row in rows),
              'archiveContentSecurity': 'NOT_QUALIFIED: scanner format/rule/size limits remain; no source removed',
              'originalProtectedRulesAndToolsModified': False,
              'coverageContinuation': {
                  'originalSourceScanRetained': True, 'perRuleTimeoutSeconds': 120,
                  'maxMemoryMiB': 1536, 'rulesDisabled': False,
                  'contextAnalysis': 'SUPPLEMENTAL_REVERSIBLE_LITERAL_CONTEXT_NOT_ORIGINAL_WORKFLOW_EXECUTION',
                  'nativeSuccessor': 'SOURCE_CANDIDATE_REVIEW_REQUIRED_NOT_OWNER_ADMISSION'},
              'originalOWASP': {'sha256': original_owasp, 'state': 'BLOCKED_RULE_CUSTODY', 'equivalenceGranted': False},
              'currentTechnicalOWASP': {'sha256': current_owasp, 'source': 'https://semgrep.dev/c/p/owasp-top-ten',
                  'capturedUTC': '2026-11-04', 'qualification': 'SEPARATE_C46_CURRENT_RULE_SNAPSHOT_NOT_ORIGINAL_G97'},
              'acceptanceGranted': False, 'release': 'NO_GO', 'results': results}
          (out / 'summary.json').write_text(json.dumps(summary, indent=2))
          raise SystemExit(0 if all(row['exit'] == 0 for row in results.values()) else 1)
          PY
      - name: Preserve technical evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: campaign46-current-scanners-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/c46-scanner-evidence/
            ${{ runner.temp }}/c46-tools/release-receipts.json
            ${{ runner.temp }}/c46-tools/official-wheel-install.json
          if-no-files-found: warn
          retention-days: 30

  native-windows:
    name: Current native46 source candidate (Windows; no admission)
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      C46_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.21.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Normal install and exact current source/native controls
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/c46-native-windows"
          mkdir -p "$evidence"
          npm install --global npm@11.20.0 --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund 2>&1 | tee "$evidence/normal-install.log"
          npm run postinstall:check 2>&1 | tee "$evidence/hooks.log"
          python -I -B scripts/release/full-app-j01/source_completion46.test.py 2>&1 | tee "$evidence/source-controls.log"
          if [ "$CURRENT_SOURCE_BRANCH" = stage/m1-native-runtime47 ]; then
            python -I -B scripts/release/full-app-j01/source_completion47.test.py 2>&1 | tee "$evidence/source47-controls.log"
            python -I -B scripts/release/full-app-j01/source_completion47.py --phase SOURCE_FROZEN 2>&1 | tee "$evidence/source-frozen.log"
            python -I -B scripts/release/full-app-j01/pods_compat47.test.py 2>&1 | tee "$evidence/generated47-properties-controls.log"
            node --test scripts/release/full-app-j01/native_generated47.test.mjs 2>&1 | tee "$evidence/generated47-controls.tap"
            node scripts/release/full-app-j01/native_generated47.mjs --phase SOURCE 2>&1 | tee "$evidence/generated47-current-source.json"
          else
            python -I -B scripts/release/full-app-j01/source_completion46.py --phase SOURCE_FROZEN 2>&1 | tee "$evidence/source-frozen.log"
          fi
          if [ "$CURRENT_SOURCE_BRANCH" = stage/m1-native-runtime47 ]; then
            node scripts/release/full-app-j01/native_generated47.mjs --phase SOURCE > "$evidence/current-native.json"
          else
            node --test scripts/phase9/ios-privacy-lock-succession46.test.mjs 2>&1 | tee "$evidence/current-native-tests.tap"
            node scripts/release/full-app-j01/native_current46.mjs > "$evidence/current-native.json"
          fi
          npm run phase9:ios-privacy-source-audit:test 2>&1 | tee "$evidence/original-source-controls.tap"
          if [ "$CURRENT_SOURCE_BRANCH" = stage/m1-native-runtime47 ]; then
            node scripts/release/full-app-j01/native_generated47.mjs --native-audit47 --strict --check 2>&1 | tee "$evidence/current-audit.log"
            node scripts/release/full-app-j01/native_generated47.mjs --native-store47 --check 2>&1 | tee "$evidence/current-inspector.log"
          else
            npm run phase9:ios-privacy-source-audit:check 2>&1 | tee "$evidence/current-audit.log"
            npm run phase9:store-build-inspect:check 2>&1 | tee "$evidence/current-inspector.log"
          fi
          if [ "$CURRENT_SOURCE_BRANCH" = stage/m1-native-runtime47 ]; then
            node scripts/release/full-app-j01/native_generated47.mjs --release-install-wiring47-test 2>&1 | tee "$evidence/install-wiring.tap"
          else
            node --test scripts/phase9/release-install-wiring46.test.mjs 2>&1 | tee "$evidence/install-wiring.tap"
          fi
      - name: Preserve Windows current-source evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: campaign46-current-native-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c46-native-windows/
          if-no-files-found: warn
          retention-days: 30
