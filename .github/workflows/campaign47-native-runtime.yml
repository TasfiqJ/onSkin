# C16 diagnostic79 preparation; execution locked until source/capacity qualification is restored.
name: Campaign47 Simulator native runtime

on:
  pull_request:
    branches:
      - stage/m1-app-completion46

permissions:
  contents: read

concurrency:
  group: campaign47-native-runtime
  cancel-in-progress: false

env:
  APP_VARIANT: staging
  CI: 'true'
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
  EXPO_NO_GIT_STATUS: '1'
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_APP_ENV: staging
  EXPO_PUBLIC_CAMERA_STACK: expo-camera
  EXPO_PUBLIC_NATIVE_CAMERA_ENABLED: 'true'
  EXPO_PUBLIC_NATIVE_OCR_ENABLED: 'true'
  EXPO_USE_PRECOMPILED_MODULES: '1'
  IOS_WIDGET_EXTENSION_BUILD_ENABLED: 'false'
  SENTRY_DISABLE_AUTO_UPLOAD: 'true'

jobs:
  native-build:
    name: C47 C16 preparation diagnostic79
    permissions:
      contents: read
      actions: read
    if: false && github.repository == 'TasfiqJ/onSkin' && github.event.repository.private == false && github.event.pull_request.head.repo.full_name == 'TasfiqJ/onSkin' && github.event.pull_request.head.ref == 'stage/m1-native-runtime47' && github.event.pull_request.number == 48 && github.event.pull_request.commits == 183 && github.run_attempt == 1
    runs-on: macos-26-intel
    timeout-minutes: 90
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      payload_bytes: ${{ steps.evidence-budget.outputs.payload_bytes }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup supported Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - name: Attach exact pinned app70 same-process diagnostic prefix
        env:
          C47_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          C47_UI_PHASE: normal-staging
          C47_ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/release/full-app-j01/pinned_app70_replay10.py --autonomous16 --output "$RUNNER_TEMP/c47-evidence"
      - name: Enforce bounded evidence upload
        id: evidence-budget
        if: always()
        run: |
          python3 -I -B - <<'PY'
          import json, os, pathlib, stat
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'c47-evidence'
          assert root.is_dir() and not root.is_symlink()
          total = 0
          for path in root.rglob('*'):
              mode = path.lstat().st_mode
              assert stat.S_ISDIR(mode) or stat.S_ISREG(mode), 'EVIDENCE_LINK_OR_SPECIAL_FILE'
              if stat.S_ISREG(mode):
                  total += path.stat().st_size
          receipt = json.loads((root / 'execution.json').read_bytes())
          reserved = receipt.get('upstream_payload_bytes', 0)
          assert type(reserved) is int and reserved >= 0
          assert 0 < total and total + reserved <= 500 * 1024 * 1024, 'EVIDENCE_BUDGET_EXCEEDED'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('payload_bytes=' + str(total) + '\n')
          print('C47_EVIDENCE_BYTES=' + str(total))
          print('C47_UPSTREAM_EVIDENCE_BYTES=' + str(reserved))
          PY
      - name: Preserve current stage evidence
        id: upload
        if: always() && steps.evidence-budget.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: campaign47-autonomous16-app70-diagnostic79-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c47-evidence
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
