name: G97 exact source mitigation proposal

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

# This additional manual workflow does not replace or turn green Security,
# Quality, DB06, iOS, release or historical scanner gates.
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact dependencies and scanner
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.20.0 --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          python -m pip install --target "$RUNNER_TEMP/g97-semgrep" --no-compile semgrep==1.177.0
          python scripts/phase9/security_acceptance/bootstrap_tools.py "$RUNNER_TEMP/g97-scanners"
      - name: Collect full raw scans and regressions
        shell: bash
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          NODE_OPTIONS: --max-old-space-size=768
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          npm_cli="$(npm root --global | tr -d '\r')/npm/bin/npm-cli.js"
          python scripts/phase9/security_acceptance/collect.py --output "$RUNNER_TEMP/g97-evidence" --npm "$npm_cli" --gitleaks "$RUNNER_TEMP/g97-scanners/gitleaks.exe" --osv "$RUNNER_TEMP/g97-scanners/osv.exe" --trufflehog "$RUNNER_TEMP/g97-scanners/trufflehog.exe" --semgrep "$RUNNER_TEMP/g97-semgrep"
      - name: Enforce complete technical evidence
        shell: bash
        run: python scripts/phase9/security_acceptance/contract.py check --evidence "$RUNNER_TEMP/g97-evidence"
      - name: Preserve raw evidence even when rejected
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g97-source-mitigation-evidence
          path: ${{ runner.temp }}/g97-evidence/
          if-no-files-found: error
          retention-days: 30

  independent-owner-acceptance:
    if: github.ref == 'refs/heads/main'
    needs: collect
    runs-on: windows-latest
    timeout-minutes: 20
    # Owner must configure required independent reviewers and prevent self-review.
    # No key or receipt is supplied by this INACTIVE source candidate.
    environment: g97-source-security-acceptance
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: g97-source-mitigation-evidence
          path: ${{ runner.temp }}/g97-evidence/
      - name: Verify a fresh installation
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.20.0 --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Verify independently signed exact-source receipt
        shell: bash
        env:
          G97_TRUSTED_OWNER_PUBLIC_KEY: ${{ secrets.G97_TRUSTED_OWNER_PUBLIC_KEY }}
          G97_OWNER_RECEIPT: ${{ secrets.G97_OWNER_RECEIPT }}
        run: |
          set -euo pipefail
          if [[ -z "${G97_TRUSTED_OWNER_PUBLIC_KEY:-}" || -z "${G97_OWNER_RECEIPT:-}" ]]; then
            printf '%s\n' 'INDEPENDENT_OWNER_ACCEPTANCE_REQUIRED' >&2
            exit 1
          fi
          printf '%s' "$G97_OWNER_RECEIPT" > "$RUNNER_TEMP/g97-owner-receipt.json"
          python scripts/phase9/security_acceptance/contract.py accept --evidence "$RUNNER_TEMP/g97-evidence" --approval "$RUNNER_TEMP/g97-owner-receipt.json"
