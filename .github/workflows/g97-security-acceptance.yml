name: G97 exact source technical evidence

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  NODE_OPTIONS: --max-old-space-size=768
  GOMAXPROCS: '2'
  GOMEMLIMIT: 768MiB

# Technical collection only. Existing Security owns actual admission.
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.21.0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare reviewed tools
        run: |
          python -B scripts/phase9/security_acceptance/bootstrap_tools.py "$RUNNER_TEMP/g97-tools"
          echo "$RUNNER_TEMP/g97-tools/cli-bin" >> "$GITHUB_PATH"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Verify all acceptance regressions
        run: python -B -m unittest discover -s scripts/phase9/security_acceptance -p test_contract.py -v
      - name: Collect full raw scans and regressions
        run: |
          python -B scripts/phase9/security_acceptance/collect.py \
            --output "$RUNNER_TEMP/g97-evidence" \
            --npm "$RUNNER_TEMP/g97-tools/npm/node_modules/npm/bin/npm-cli.js" \
            --gitleaks "$RUNNER_TEMP/g97-tools/scanners/gitleaks" \
            --osv "$RUNNER_TEMP/g97-tools/scanners/osv" \
            --trufflehog "$RUNNER_TEMP/g97-tools/scanners/trufflehog" \
            --semgrep "$RUNNER_TEMP/g97-tools/semgrep"
      - name: Enforce complete technical evidence
        run: python -B scripts/phase9/security_acceptance/contract.py check --evidence "$RUNNER_TEMP/g97-evidence"
      - name: Preserve raw evidence even when rejected
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g97-source-mitigation-evidence
          path: ${{ runner.temp }}/g97-evidence/
          if-no-files-found: error
          retention-days: 30
