name: Security candidate23 (technical components only)

on:
  pull_request:

permissions:
  contents: read

jobs:
  public-components:
    name: Current public components; custody remains required
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind required public refs
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main refs/heads/stage/m1-f09-layout-compatibility21:refs/remotes/origin/stage/m1-f09-layout-compatibility21 refs/heads/stage/m1-security-recovery22:refs/remotes/origin/stage/m1-security-recovery22
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin refs/pull/${{ github.event.pull_request.number }}/merge
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Use pinned npm
        run: |
          prefix="$RUNNER_TEMP/security23-tools"
          npm install --global --prefix "$prefix" npm@11.20.0 --ignore-scripts --no-audit --no-fund
          if [ "$RUNNER_OS" = Windows ]; then
            python -I -B - "$prefix" <<'PY'
          import hashlib, os, stat, sys
          from pathlib import Path
          target = Path(sys.argv[1]).absolute() / 'node_modules/npm/npmrc'
          if os.path.lexists(target):
              assert sys.flags.optimize == 0 and target.resolve() == target
              before = target.lstat()
              assert stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and before.st_size == 22
              assert not stat.S_ISLNK(before.st_mode) and not getattr(before, 'st_file_attributes', 0) & 1024
              descriptor = os.open(target, os.O_RDONLY | getattr(os, 'O_NOFOLLOW', 0) | getattr(os, 'O_BINARY', 0))
              try:
                  opened = os.fstat(descriptor)
                  assert (opened.st_dev, opened.st_ino, opened.st_size) == (before.st_dev, before.st_ino, before.st_size)
                  raw = os.read(descriptor, 23)
                  assert len(raw) == 22 and hashlib.sha256(raw).hexdigest() == 'af0199c6f93e02f7a6b946e9764cf19f2e598e547da1853f8205e0263872b9ef'
                  after = target.lstat()
                  assert (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns) == (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns)
              finally:
                  os.close(descriptor)
              target.unlink()
              print('REMOVED_ONLY_AUTHENTIC_TARBALL_ABSENT_WINDOWS_BOOTSTRAP_CONFIG')
          PY
            cp "$(node -p 'process.execPath')" "$prefix/node.exe"
            echo "$prefix" >> "$GITHUB_PATH"
          else
            mkdir -p "$prefix/bin"
            cp "$(node -p 'process.execPath')" "$prefix/bin/node"
            echo "$prefix/bin" >> "$GITHUB_PATH"
          fi
      - name: Synthetic disclosure gate
        id: disclosure
        run: |
          python -c 'import json,sys; print(json.dumps({"qualification":"OBSERVED_RUNTIME_VERSION_NOT_TOOL_IDENTITY","python":list(sys.version_info[:3])}))'
          python -B scripts/security22/test_security22.py
          python -B scripts/security23/test_partial_results.py
          python -B scripts/security23/test_integration.py
          python -B scripts/security23/test_toolchain.py --regressions | tee "$RUNNER_TEMP/security23-toolchain-controls.json"
      - name: Authentic historical inventory defect control
        run: python -B scripts/security23/test_toolchain.py
      - name: Normal lockfile installation with mandatory hooks
        id: install
        run: npm ci --no-audit --no-fund
      - name: Historical fixtures and current installed native source controls
        run: |
          python -B scripts/security23/test_integration.py --native-controls | tee "$RUNNER_TEMP/security23-native-controls.json"
      - name: Campaign24 bounded advisory controls and exact installed graph
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          node --test scripts/security24/advisory-behavior.test.mjs scripts/security24/patch-tooling.test.mjs | tee "$RUNNER_TEMP/security24-advisory-controls.tap"
          node scripts/security24/graph.mjs > "$RUNNER_TEMP/security24-advisory-graph.json"
      - name: Authenticated historical Release24 and Release25 source controls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          python -I -B scripts/release/full-app-j01/source_consumer26.test.py --historical-replay --receipt "$RUNNER_TEMP/security26-historical-receipt.json" | tee "$RUNNER_TEMP/security26-historical-controls.jsonl"
      - name: Current Campaign26 finite source governance controls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          python -I -B scripts/release/full-app-j01/source_consumer26.test.py | tee "$RUNNER_TEMP/security26-source-controls.jsonl"
          python -I -B scripts/release/full-app-j01/check.py | tee "$RUNNER_TEMP/security26-current-source.json"
      - name: Execute current public checks and preserve component results
        if: ${{ !cancelled() && steps.disclosure.outcome == 'success' && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/security22/run.py --output-dir "$RUNNER_TEMP/security22-components" | tee "$RUNNER_TEMP/security22-public.json"
      - name: Retain only allowlisted public component evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security23-public-components-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/security22-public.json
            ${{ runner.temp }}/security22-components/*.json
            ${{ runner.temp }}/security23-toolchain-controls.json
            ${{ runner.temp }}/security23-native-controls.json
            ${{ runner.temp }}/security24-advisory-controls.tap
            ${{ runner.temp }}/security24-advisory-graph.json
            ${{ runner.temp }}/security26-historical-receipt.json
            ${{ runner.temp }}/security26-historical-controls.jsonl
            ${{ runner.temp }}/security26-source-controls.jsonl
            ${{ runner.temp }}/security26-current-source.json
          if-no-files-found: ignore
          retention-days: 7
