<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Layerwell verification code</title>
  </head>
  <body style="margin: 0; background: #f7f3ee; color: #24211f; font-family: Arial, sans-serif">
    <main style="box-sizing: border-box; margin: 0 auto; max-width: 560px; padding: 40px 24px">
      <h1 style="font-size: 24px; line-height: 1.25; margin: 0 0 16px">
        Verify your email for Layerwell
      </h1>
      <p style="font-size: 16px; line-height: 1.5; margin: 0 0 20px">
        Enter this code in Layerwell to protect your plan and finish creating your account:
      </p>
      <p
        aria-label="Verification code"
        style="font-family: monospace; font-size: 32px; font-weight: 700; letter-spacing: 6px; line-height: 1.25; margin: 0 0 20px"
      >
        {{ .Token }}
      </p>
      <p style="font-size: 14px; line-height: 1.5; margin: 0 0 12px">
        This code expires in 60 minutes. If you did not request it, you can ignore this email.
      </p>
      <p style="font-size: 14px; line-height: 1.5; margin: 0">
        Layerwell will never ask you to send this code to another person.
      </p>
    </main>
  </body>
</html>
