# Supabase local config. The CLI (`supabase init`) normally generates a much
# larger file; this is a hand-authored minimal config documenting the settings
# Layerwell's auth flow requires. Provider secrets live in the dashboard / env, not
# here. BLOCKED: B-SUPABASE (project ref + keys).
project_id = "layerwell"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# Skin photos: private bucket only (docs/01 §3 — public buckets bypass RLS on read).
file_size_limit = "10MiB"

[auth]
enabled = true
# Deep-link scheme for OAuth / OTP redirects (docs/01 §5).
site_url = "layerwell://"
additional_redirect_urls = ["layerwell://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Guest-first: anonymous sessions are the default entry (docs/01 §1).
enable_anonymous_sign_ins = true
# Required for anon->permanent identity linking (docs/01 §1).
enable_manual_linking = true
# The local CLI config has no leaked-password-protection key. Hosted staging
# and production must still enable Auth's `password_hibp_enabled` control in
# the dashboard/Management API on a supported plan; see supabase/README.md.

[auth.email]
enable_signup = true
# OTP codes over magic links for mobile reliability (docs/01 §1).
enable_confirmations = false
otp_length = 6
otp_expiry = 3600

# Social providers — enabled + configured with secrets in the dashboard.
# BLOCKED: B-APPLE / B-GOOGLE.
[auth.external.apple]
enabled = true
[auth.external.google]
enabled = true

# CAPTCHA for anon + signup abuse protection. BLOCKED: B-TURNSTILE.
[auth.captcha]
enabled = true
provider = "turnstile"

# Per-function JWT behavior is source controlled here. Extended auth, secret,
# public-access, and resource-budget metadata lives in functions/manifest.json.
[functions.account-deletion]
verify_jwt = false
entrypoint = "./functions/account-deletion/index.ts"

[functions.apple-account-events]
verify_jwt = false
entrypoint = "./functions/apple-account-events/index.ts"

[functions.apple-auth-lifecycle]
verify_jwt = true
entrypoint = "./functions/apple-auth-lifecycle/index.ts"

[functions.apple-auth-worker]
verify_jwt = false
entrypoint = "./functions/apple-auth-worker/index.ts"

[functions.catalog-lookup]
verify_jwt = true
entrypoint = "./functions/catalog-lookup/index.ts"

[functions.catalog-operator]
verify_jwt = true
entrypoint = "./functions/catalog-operator/index.ts"

[functions.catalog-report]
verify_jwt = true
entrypoint = "./functions/catalog-report/index.ts"

[functions.catalog-search]
verify_jwt = true
entrypoint = "./functions/catalog-search/index.ts"

[functions.consent-withdrawal]
verify_jwt = true
entrypoint = "./functions/consent-withdrawal/index.ts"

[functions.data-export]
verify_jwt = true
entrypoint = "./functions/data-export/index.ts"

[functions.health-consent-worker]
verify_jwt = false
entrypoint = "./functions/health-consent-worker/index.ts"

[functions.growth-event]
verify_jwt = false
entrypoint = "./functions/growth-event/index.ts"

[functions.order-report-poll]
verify_jwt = false
entrypoint = "./functions/order-report-poll/index.ts"

[functions.revenuecat-webhook]
verify_jwt = false
entrypoint = "./functions/revenuecat-webhook/index.ts"

[functions.subscription-grants]
verify_jwt = true
entrypoint = "./functions/subscription-grants/index.ts"

[functions.subscription-reconciliation]
verify_jwt = true
entrypoint = "./functions/subscription-reconciliation/index.ts"

[functions.waitlist]
